apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asgi-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DhmhtrhsGkantiafikas/ASGI-Server-in-Kubernetes-Enviroment'
    path: k8s
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
